<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine's Surprise</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(120deg, #ff9a9e, #fad0c4, #fad0c4, #ffdde1);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  position: relative;
  width: 90%;
  max-width: 600px;
  text-align: center;
  z-index: 2;
}

.voice-note {
  margin-bottom: 80px;
}

.buttons {
  position: relative;
  height: 50px;
}

/* Glassy base style for buttons */
.btn {
  padding: 15px 40px;
  font-size: 1.3rem;
  border-radius: 50px;
  border: none;
  font-weight: 600;
  letter-spacing: 1px;
  transition: all 0.4s ease;
  position: absolute;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  cursor: pointer;
}

/* YES button glassy style */
.btn-yes {
  background: rgba(156, 7, 7, 0.2);
  border: 1px solid rgba(25, 2, 2, 0.5);
  color: #510505;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
}
.btn-yes:hover {
  background: rgba(255, 255, 255, 0.35);
  transform: translateX(-50%) scale(1.2);
  box-shadow: 0 0 30px rgba(255, 105, 135, 0.7), 0 8px 30px rgba(0,0,0,0.2);
  letter-spacing: 2px;
}

/* NO button glassy style */
.btn-no {
  background: rgba(152, 4, 4, 0.15);
  border: 1px solid rgba(28, 3, 3, 0.3);
  color: #fd2222;
  font-weight: 500;
  cursor: not-allowed;
}
.btn-no:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: scale(1.05);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

/* Floating hearts */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: red;
  transform: rotate(-45deg);
  animation: floatHeart 6s linear infinite;
  opacity: 0.8;
}
.heart:before,
.heart:after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: red;
  border-radius: 50%;
}
.heart:before { top: -10px; left: 0; }
.heart:after { left: 10px; top: 0; }

@keyframes floatHeart {
  0% {transform: translateY(0) rotate(-45deg); opacity:0;}
  50% {opacity:1;}
  100% {transform: translateY(-800px) rotate(-45deg); opacity:0;}
}
</style>
</head>
<body>

<div class="container">
  <div class="voice-note">
    <h1>Listen to this message 💌 </h1>
    <h3>Ear buds compulsory</h3>
    <audio controls autoplay>
      <source src="audio.mpeg" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="buttons">
    <button class="btn btn-yes" onclick="redirectToThankYou()">YES</button>
    <button class="btn btn-no" id="btnNo">NO</button>
  </div>
</div>

<script>
// YES click → redirect
function redirectToThankYou() {
  window.location.href = 'thankyou.html';
}

// NO button dodge inside container
const btnNo = document.getElementById('btnNo');
const container = document.querySelector('.container');
const btnYes = document.querySelector('.btn-yes');

btnNo.style.left = '50px';
btnNo.style.top = '0px';

container.addEventListener('mousemove', (e) => {
  const rectNo = btnNo.getBoundingClientRect();
  const rectYes = btnYes.getBoundingClientRect();
  const rectContainer = container.getBoundingClientRect();
  const x = e.clientX;
  const y = e.clientY;

  if (x > rectNo.left - 50 && x < rectNo.right + 50 &&
      y > rectNo.top - 50 && y < rectNo.bottom + 50) {
    
    let newX, newY, overlap = true;
    let attempts = 0;

    while(overlap && attempts < 100) {
      newX = Math.random() * (rectContainer.width - rectNo.width);
      newY = Math.random() * (rectContainer.height - rectNo.height - 50);

      overlap = !(newX + rectNo.width < rectYes.offsetLeft ||
                  newX > rectYes.offsetLeft + rectYes.offsetWidth ||
                  newY + rectNo.height < rectYes.offsetTop ||
                  newY > rectYes.offsetTop + rectYes.offsetHeight);
      attempts++;
    }

    btnNo.style.left = newX + 'px';
    btnNo.style.top = newY + 'px';
  }
});

// Floating hearts
for(let i=0; i<50; i++) {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.style.left = Math.random()*100 + 'vw';
  heart.style.animationDuration = 4 + Math.random()*4 + 's';
  heart.style.width = 10 + Math.random()*20 + 'px';
  heart.style.height = heart.style.width;
  heart.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;
  document.body.appendChild(heart);
}
</script>

</body>
</html>
